name: ${COMPOSE_PROJECT_NAME:-ecommerce-challenge}

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      commerce-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  commerce-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SERVICE_PATH: services/commerce-api
    command: ["/usr/local/bin/start-commerce.sh"]
    environment:
      APP_DEBUG: "false"
      APP_ENV: local
      APP_KEY: ${COMMERCE_APP_KEY}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CACHE_STORE: database
      DB_CONNECTION: mysql
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
      GUEST_ORDER_LINK_DAYS: ${GUEST_ORDER_LINK_DAYS:-30}
      ORDER_NUMBER_PREFIX: ${ORDER_NUMBER_PREFIX:-ORD-}
      ORDER_NUMBER_START: ${ORDER_NUMBER_START:-100001}
      PAYMENT_API_URL: http://payment-api:8000/api/v1/payments
      PAYMENT_CALLBACK_URL: http://commerce-api:8000/api/v1/payments/webhooks/mock
      QUEUE_CONNECTION: database
      RESERVATION_TIMEOUT_SECONDS: ${RESERVATION_TIMEOUT_SECONDS:-120}
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health/ready') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - product_media:/app/storage/app/public/products
    restart: unless-stopped

  reservation-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SERVICE_PATH: services/commerce-api
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_DEBUG: "false"
      APP_ENV: local
      APP_KEY: ${COMMERCE_APP_KEY}
      CACHE_STORE: database
      DB_CONNECTION: mysql
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_HOST: mysql
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      LOG_CHANNEL: stderr
      RESERVATION_WORKER_INTERVAL_SECONDS: ${RESERVATION_WORKER_INTERVAL_SECONDS:-5}
    depends_on:
      commerce-api:
        condition: service_healthy
    restart: unless-stopped

  payment-api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        SERVICE_PATH: services/payment-api
    command: ["/usr/local/bin/start-payment.sh"]
    environment:
      APP_DEBUG: "false"
      APP_ENV: local
      APP_KEY: ${PAYMENT_APP_KEY}
      CACHE_STORE: redis
      LOG_CHANNEL: stderr
      QUEUE_CONNECTION: redis
      PAYMENT_CALLBACK_URL: http://commerce-api:8000/api/v1/payments/webhooks/mock
      PAYMENT_LATE_SUCCESS_DELAY_SECONDS: ${PAYMENT_LATE_SUCCESS_DELAY_SECONDS:-150}
      PAYMENT_NORMAL_DELAY_MAX_SECONDS: ${PAYMENT_NORMAL_DELAY_MAX_SECONDS:-8}
      PAYMENT_NORMAL_DELAY_MIN_SECONDS: ${PAYMENT_NORMAL_DELAY_MIN_SECONDS:-2}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health/ready') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8.4.7-alpine3.22
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  product_media:
