openapi: 3.1.0
info:
  title: E-commerce Mock Payment API
  version: 1.0.0
  description: Independent mock-provider contract. This service is for deterministic demo payment outcomes only.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getPaymentLiveness
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/ready:
    get:
      operationId: getPaymentReadiness
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/payments:
    post:
      operationId: createMockPayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '202':
          description: Payment simulation accepted; an identical idempotent replay returns the original acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentAcceptance' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  responses:
    Health:
      description: Healthy
      content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
    Conflict: { description: Idempotency key reused with a different payload, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    ValidationError: { description: Invalid simulation request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    TooManyRequests: { description: Rate limit exceeded, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    InternalError: { description: Unexpected provider error, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    ServiceUnavailable: { description: Redis or worker unavailable, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    MoneyAmount: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{2})$' }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$' }
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [payment-api] }
      additionalProperties: false
    PaymentRequest:
      type: object
      required: [commerce_payment_id, commerce_order_id, amount, currency, callback_url, callback_reference, payment_test_number]
      properties:
        commerce_payment_id: { $ref: '#/components/schemas/Ulid' }
        commerce_order_id: { $ref: '#/components/schemas/Ulid' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        callback_url: { type: string, format: uri }
        callback_reference: { type: string, minLength: 1, maxLength: 255 }
        payment_test_number: { type: string, enum: ['4000000000010001', '4000000000000002', '4000000000090003', '4000000000080004'] }
      additionalProperties: false
    PaymentAcceptance:
      type: object
      required: [provider_payment_id, status]
      properties:
        provider_payment_id: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [processing] }
      additionalProperties: false
    ProblemDetails:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
      additionalProperties: false
