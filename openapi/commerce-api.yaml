    InventoryAdjustment:
      type: object
      required: [id, product_id, previous_on_hand, new_on_hand, reason, actor_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        product_id: { $ref: '#/components/schemas/Ulid' }
        previous_on_hand: { type: integer, minimum: 0 }
        new_on_hand: { type: integer, minimum: 0 }
        reason: { type: string }
        note: { type: string }
        actor_id: { $ref: '#/components/schemas/Ulid' }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
      additionalProperties: false
    InventoryAdjustmentPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InventoryAdjustment' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: false
    ImportRejection:
      type: object
      required: [row, reason]
      properties:
        row: { type: integer, minimum: 1 }
        sku: { type: string }
        reason: { type: string }
      additionalProperties: false
    ProductImport:
      type: object
      required: [id, status, original_filename, mode, unknown_category_policy, stock_override, stock_override_confirmed_at, total_rows, accepted_rows, warning_rows, rejected_rows, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [completed, completed_with_rejections, failed] }
        original_filename: { type: string }
        mode: { type: string, enum: [create_only, update_only, upsert] }
        unknown_category_policy: { type: string, enum: [reject, create, uncategorized], description: "create creates every missing category encountered in valid rows; reject rejects unknown categories; uncategorized imports without a category and records a warning." }
        stock_override: { type: boolean }
        stock_override_confirmed_at:
