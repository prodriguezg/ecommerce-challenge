      additionalProperties: false
    AuditLogPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: false
