        rejected_rows: { type: integer, minimum: 0 }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
      additionalProperties: false
    Setting:
      type: object
      required: [key, value, source]
      properties:
        key: { type: string, enum: [reservation_timeout_seconds] }
        value: { type: integer, minimum: 30, maximum: 3600 }
        source: { type: string, enum: [environment, database] }
      additionalProperties: false
    AuditLog:
      type: object
      required: [id, actor_id, action, subject_type, subject_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        actor_id: { $ref: '#/components/schemas/Ulid' }
        action: { type: string }
        subject_type: { type: string }
        subject_id: { $ref: '#/components/schemas/Ulid' }
