openapi: 3.1.0
info:
  title: E-commerce Commerce API
  version: 1.0.0
  description: Authoritative design-first contract for the storefront, customer, and administration APIs.
servers:
  - url: /api/v1
tags:
  - { name: Health }
  - { name: Setup }
  - { name: Catalog }
  - { name: Authentication }
  - { name: Cart }
  - { name: Checkout }
  - { name: Orders }
  - { name: Payments }
  - { name: Admin catalog }
  - { name: Admin inventory }
  - { name: Admin imports }
  - { name: Admin orders }
  - { name: Admin settings }
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [Setup]
      responses:
        '200':
          description: Setup availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                additionalProperties: false
  /setup/admin:
    post:
      operationId: createInitialAdmin
      tags: [Setup]
      requestBody: { $ref: '#/components/requestBodies/SetupAdmin' }
      responses:
        '201': { $ref: '#/components/responses/Principal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products:
    get:
      operationId: listProducts
      tags: [Catalog]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/CategoryFilter' }
        - { $ref: '#/components/parameters/MinPrice' }
        - { $ref: '#/components/parameters/MaxPrice' }
        - { $ref: '#/components/parameters/InStock' }
        - { $ref: '#/components/parameters/ProductSort' }
        - { $ref: '#/components/parameters/SortDirection' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/ProductPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /products/{product}:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    get:
      operationId: getProduct
      tags: [Catalog]
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{product}/image:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    get:
      operationId: getProductImage
      tags: [Catalog]
      responses:
        '200':
          description: Uploaded product image or the SVG placeholder
          headers:
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      responses:
        '200': { $ref: '#/components/responses/CategoryList' }
  /shipping-methods:
    get:
      operationId: listShippingMethods
      tags: [Catalog]
      responses:
        '200': { $ref: '#/components/responses/ShippingMethodList' }
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Principal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Session invalidated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Principal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /customers/register:
    post:
      operationId: registerCustomer
      tags: [Authentication]
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Principal' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guest-orders/{order}/register:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
      - { $ref: '#/components/parameters/GuestToken' }
    post:
      operationId: registerFromGuestOrder
      tags: [Authentication]
      requestBody: { $ref: '#/components/requestBodies/GuestRegistration' }
      responses:
        '201': { $ref: '#/components/responses/Principal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /cart:
    get:
      operationId: getCart
      tags: [Cart]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cart/items/{product}:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    put:
      operationId: setCartItemQuantity
      tags: [Cart]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CartQuantity' }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteCartItem
      tags: [Cart]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/shipping-method:
    put:
      operationId: setCartShippingMethod
      tags: [Cart]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ShippingSelection' }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/merge:
    post:
      operationId: mergeGuestCart
      tags: [Cart]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CartLines' }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/quote:
    post:
      operationId: quoteCart
      tags: [Cart]
      security: [{ cookieAuth: [] }, {}]
      requestBody: { $ref: '#/components/requestBodies/CartQuote' }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /checkouts:
    post:
      operationId: createCheckout
      description: Creates a checkout for either a cookie-authenticated customer or a guest. The idempotency key is scoped to that access context.
      tags: [Checkout]
      security: [{ cookieAuth: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { $ref: '#/components/requestBodies/Checkout' }
      responses:
        '202':
          description: Payment accepted for asynchronous processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /orders:
    get:
      operationId: listCustomerOrders
      tags: [Orders]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{order}:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
    get:
      operationId: getCustomerOrder
      tags: [Orders]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order}/status:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
    get:
      operationId: getCustomerOrderStatus
      tags: [Orders]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/OrderStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /guest-orders/{order}:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
      - { $ref: '#/components/parameters/GuestToken' }
    get:
      operationId: getGuestOrder
      tags: [Orders]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /guest-orders/{order}/status:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
      - { $ref: '#/components/parameters/GuestToken' }
    get:
      operationId: getGuestOrderStatus
      tags: [Orders]
      responses:
        '200': { $ref: '#/components/responses/OrderStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /payments/webhooks/mock:
    post:
      operationId: receiveMockPaymentWebhook
      tags: [Payments]
      security: [{ mockWebhookBearer: [] }]
      requestBody: { $ref: '#/components/requestBodies/PaymentWebhook' }
      responses:
        '204': { description: Event accepted or already processed }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/DeletedFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/ProductPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminProduct
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductMutation' }
      responses:
        '201': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/products/{product}:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    get:
      operationId: getAdminProduct
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceAdminProduct
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      requestBody: { $ref: '#/components/requestBodies/ProductMutation' }
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminProduct
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      responses:
        '204': { description: Product deleted or deactivated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{product}/image:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    post:
      operationId: replaceAdminProductImage
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductImage' }
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: deleteAdminProductImage
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CategoryList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminCategory
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CategoryMutation' }
      responses:
        '201': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/categories/{category}:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    get:
      operationId: getAdminCategory
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceAdminCategory
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      requestBody: { $ref: '#/components/requestBodies/CategoryMutation' }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminCategory
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      responses:
        '204': { description: Category soft-deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/taxes:
    get:
      operationId: listAdminTaxes
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/TaxList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminTax
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TaxMutation' }
      responses:
        '201': { $ref: '#/components/responses/Tax' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/taxes/{tax}:
    parameters:
      - { $ref: '#/components/parameters/TaxId' }
    get:
      operationId: getAdminTax
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Tax' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceAdminTax
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      requestBody: { $ref: '#/components/requestBodies/TaxMutation' }
      responses:
        '200': { $ref: '#/components/responses/Tax' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminTax
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      responses:
        '204': { description: Tax soft-deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stale version or active references prevent deletion
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/TaxDeleteProblem' }
  /admin/shipping-methods:
    get:
      operationId: listAdminShippingMethods
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ShippingMethodList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAdminShippingMethod
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ShippingMethodMutation' }
      responses:
        '201': { $ref: '#/components/responses/ShippingMethod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/shipping-methods/{shippingMethod}:
    parameters:
      - { $ref: '#/components/parameters/ShippingMethodId' }
    get:
      operationId: getAdminShippingMethod
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ShippingMethod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceAdminShippingMethod
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      requestBody: { $ref: '#/components/requestBodies/ShippingMethodMutation' }
      responses:
        '200': { $ref: '#/components/responses/ShippingMethod' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminShippingMethod
      tags: [Admin catalog]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedVersion' }
      responses:
        '204': { description: Shipping method soft-deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{product}/inventory:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    get:
      operationId: getAdminProductInventory
      tags: [Admin inventory]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Inventory' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{product}/inventory-adjustments:
    parameters:
      - { $ref: '#/components/parameters/ProductId' }
    get:
      operationId: listAdminInventoryAdjustments
      tags: [Admin inventory]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/InventoryAdjustmentPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAdminInventoryAdjustment
      tags: [Admin inventory]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/InventoryAdjustment' }
      responses:
        '201': { $ref: '#/components/responses/Inventory' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/product-imports:
    post:
      operationId: createAdminProductImport
      description: >-
        Processes a bounded CSV synchronously. File-level failures reject the import;
        valid rows commit independently and invalid rows are retained as sanitized rejections.
        Numeric fields trim surrounding whitespace and accept ungrouped digits or standard
        thousands commas (first group 1–3 digits, subsequent groups exactly three digits).
        CSV cells containing commas must be quoted. Price accepts integers or 1–2 decimal
        places and one optional leading dollar sign with optional whitespace after it
        (12, 12.5, $ 12.50, "$1,234.56"). Weight_kg accepts integers or 1–4 decimal places
        (2, 2.5000, "1,234.5678"). Stock accepts integers only (0, 12, "1,000").
        Weight_kg and stock do not accept dollar signs. Normalized values are persisted
        without currency symbols or grouping separators, without rounding or truncation.
        Values must be non-negative and within database ranges (price at most
        999999999999999.9999, weight_kg at most 99999999.9999, stock at most 4294967295).
        When stock is written, its audit adjustment delta must fit -2147483648 to 2147483647;
        new-product stock is therefore at most 2147483647. Larger changes also reject the
        row with Invalid stock value.
        Empty values, signs, negatives, exponents, decimal commas, NaN, Infinity, malformed
        grouping, excess decimal places, and out-of-range values reject only their row
        with the exact reasons Invalid price value, Invalid weight_kg value, or
        Invalid stock value. Every applicable numeric reason appears once in the rejection
        CSV. Numeric validation applies even when CSV stock is ignored for existing products.
      tags: [Admin imports]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProductImport' }
      responses:
        '200': { $ref: '#/components/responses/ProductImport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ImportValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/product-imports/{import}:
    parameters:
      - { $ref: '#/components/parameters/ImportId' }
    get:
      operationId: getAdminProductImport
      tags: [Admin imports]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProductImport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/product-imports/{import}/rejections.csv:
    parameters:
      - { $ref: '#/components/parameters/ImportId' }
    get:
      operationId: downloadAdminProductImportRejections
      tags: [Admin imports]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Sanitized rejected rows with a reason column
          headers:
            Content-Disposition:
              schema: { type: string, pattern: '^attachment; filename="[a-zA-Z0-9._-]+"$' }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [Admin orders]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderStatusFilter' }
        - { $ref: '#/components/parameters/PaymentStateFilter' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/CustomerEmailFilter' }
        - { $ref: '#/components/parameters/OrderNumberFilter' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/orders/{order}:
    parameters:
      - { $ref: '#/components/parameters/OrderId' }
    get:
      operationId: getAdminOrder
      tags: [Admin orders]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/manual-reviews:
    get:
      operationId: listAdminManualReviews
      tags: [Admin orders]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/manual-reviews/{review}/resolve:
    parameters:
      - { $ref: '#/components/parameters/ReviewId' }
    post:
      operationId: resolveAdminManualReview
      tags: [Admin orders]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ReviewResolution' }
      responses:
        '200': { $ref: '#/components/responses/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/settings:
    get:
      operationId: listAdminSettings
      tags: [Admin settings]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/SettingList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/settings/{key}:
    parameters:
      - { $ref: '#/components/parameters/SettingKey' }
    put:
      operationId: setAdminSetting
      tags: [Admin settings]
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SettingMutation' }
      responses:
        '200': { $ref: '#/components/responses/Setting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAdminSettingOverride
      tags: [Admin settings]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Setting' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [Admin settings]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/AuditActorFilter' }
        - { $ref: '#/components/parameters/AuditActionFilter' }
        - { $ref: '#/components/parameters/AuditTargetFilter' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { $ref: '#/components/responses/AuditLogPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum session cookie. State-changing browser requests also require the X-XSRF-TOKEN header after obtaining CSRF state.
    mockWebhookBearer:
      type: http
      scheme: bearer
      bearerFormat: configured-static-token
  parameters:
    ProductId: { name: product, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    CategoryId: { name: category, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    TaxId: { name: tax, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    ShippingMethodId: { name: shippingMethod, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    OrderId: { name: order, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    ImportId: { name: import, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    ReviewId: { name: review, in: path, required: true, schema: { $ref: '#/components/schemas/Ulid' } }
    SettingKey: { name: key, in: path, required: true, schema: { type: string, enum: [reservation_timeout_seconds] } }
    GuestToken: { name: guest_token, in: query, required: true, schema: { type: string, minLength: 32, maxLength: 255 }, description: Private guest-order bearer secret returned only at checkout. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 255 } }
    ExpectedVersion: { name: If-Match-Version, in: header, required: true, schema: { type: integer, minimum: 1 }, description: Expected current resource version for optimistic concurrency. }
    Search: { name: q, in: query, schema: { type: string, maxLength: 200 } }
    CategoryFilter: { name: category, in: query, schema: { $ref: '#/components/schemas/Ulid' } }
    MinPrice: { name: min_price, in: query, schema: { $ref: '#/components/schemas/MoneyAmount' } }
    MaxPrice: { name: max_price, in: query, schema: { $ref: '#/components/schemas/MoneyAmount' } }
    InStock: { name: in_stock, in: query, schema: { type: boolean } }
    ProductSort: { name: sort, in: query, schema: { type: string, enum: [name, price, created_at] } }
    SortDirection: { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    DeletedFilter: { name: deleted, in: query, schema: { type: string, enum: [exclude, include, only], default: exclude } }
    OrderStatusFilter: { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
    PaymentStateFilter: { name: payment_status, in: query, schema: { type: string, enum: [requested, processing, initiation_failed, succeeded, declined, provider_error] } }
    CustomerEmailFilter: { name: email, in: query, schema: { type: string, format: email, maxLength: 254 } }
    OrderNumberFilter: { name: number, in: query, schema: { type: string, maxLength: 64 } }
    AuditActorFilter: { name: actor, in: query, schema: { type: string, maxLength: 254 }, description: Actor ULID or exact email address. }
    AuditActionFilter: { name: action, in: query, schema: { type: string, maxLength: 64 } }
    AuditTargetFilter: { name: target, in: query, schema: { type: string, maxLength: 200 }, description: Exact target ULID or partial target type. }
    DateFrom: { name: date_from, in: query, schema: { type: string, format: date } }
    DateTo: { name: date_to, in: query, schema: { type: string, format: date } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, enum: [10, 20, 50, 100], default: 20 } }
  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 254 }
              password: { type: string, minLength: 10, maxLength: 255, pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$' }
            additionalProperties: false
    SetupAdmin:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SetupAdminInput' }
    Register:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RegistrationInput' }
    GuestRegistration:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: { type: string, minLength: 10, maxLength: 255, pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$' }
            additionalProperties: false
    CartQuantity:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [quantity]
            properties:
              quantity: { type: integer, minimum: 1, maximum: 999 }
            additionalProperties: false
    ShippingSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [shipping_method_id]
            properties:
              shipping_method_id:
                oneOf:
                  - { $ref: '#/components/schemas/Ulid' }
                  - { type: 'null' }
            additionalProperties: false
    CartLines:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lines]
            properties:
              lines:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/CartLineInput' }
            additionalProperties: false
    CartQuote:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [lines]
            properties:
              lines:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/CartLineInput' }
              shipping_method_id:
                oneOf:
                  - { $ref: '#/components/schemas/Ulid' }
                  - { type: 'null' }
            additionalProperties: false
    Checkout:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CheckoutInput' }
    PaymentWebhook:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentWebhookInput' }
    ProductMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductInput' }
    CategoryMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CategoryInput' }
    TaxMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaxInput' }
    ShippingMethodMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ShippingMethodInput' }
    ProductImage:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [image]
            properties:
              image: { type: string, format: binary, description: 'JPEG, PNG, or WebP image within the configured byte limit.' }
            additionalProperties: false
    InventoryAdjustment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [on_hand, reason]
            properties:
              on_hand: { type: integer, minimum: 0 }
              reason: { type: string, minLength: 1, maxLength: 100 }
              note: { type: string, maxLength: 1000 }
            additionalProperties: false
    ProductImport:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, mode, unknown_category_policy, override_stock]
            properties:
              file: { type: string, format: binary }
              mode: { type: string, enum: [create_only, update_only, upsert] }
              unknown_category_policy: { type: string, enum: [reject, create, uncategorized], description: "create creates every missing category encountered in valid rows; reject rejects unknown categories; uncategorized imports without a category and records a warning." }
              override_stock: { type: boolean }
              confirm_stock_override: { type: boolean, description: Must be true when override_stock is true. }
            additionalProperties: false
    ReviewResolution:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [note, version]
            properties:
              note: { type: string, minLength: 1, maxLength: 2000, pattern: '.*\S.*' }
              version: { type: integer, minimum: 1 }
            additionalProperties: false
    SettingMutation:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [value]
            properties:
              value: { type: integer, minimum: 30, maximum: 3600 }
            additionalProperties: false
  responses:
    Health:
      description: Healthy
      content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
    Product:
      description: Product
      content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
    ProductPage:
      description: Paginated products
      content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
    Category:
      description: Category
      content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } }
    CategoryList:
      description: Categories
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
    ShippingMethod:
      description: Shipping method
      content: { application/json: { schema: { $ref: '#/components/schemas/ShippingMethod' } } }
    ShippingMethodList:
      description: Shipping methods
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShippingMethod' } } } }
    Tax:
      description: Tax
      content: { application/json: { schema: { $ref: '#/components/schemas/Tax' } } }
    TaxList:
      description: Taxes
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Tax' } } } }
    Principal:
      description: Authenticated principal
      content: { application/json: { schema: { $ref: '#/components/schemas/Principal' } } }
    Cart:
      description: Revalidated cart and totals
      content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } }
    Order:
      description: Order detail
      content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
    OrderPage:
      description: Paginated orders
      content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } }
    OrderStatus:
      description: Current order and payment status
      content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatusView' } } }
    Inventory:
      description: Inventory quantities
      content: { application/json: { schema: { $ref: '#/components/schemas/Inventory' } } }
    InventoryAdjustmentPage:
      description: Paginated inventory adjustments
      content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAdjustmentPage' } } }
    ProductImport:
      description: Import result and row counts
      content: { application/json: { schema: { $ref: '#/components/schemas/ProductImport' } } }
    Setting:
      description: Effective setting
      content: { application/json: { schema: { $ref: '#/components/schemas/Setting' } } }
    SettingList:
      description: Allowlisted settings
      content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Setting' } } } }
    AuditLogPage:
      description: Paginated audit events
      content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } }
    BadRequest: { $ref: '#/components/responses/Problem400' }
    Unauthenticated: { $ref: '#/components/responses/Problem401' }
    Forbidden: { $ref: '#/components/responses/Problem403' }
    NotFound: { $ref: '#/components/responses/Problem404' }
    Conflict: { $ref: '#/components/responses/Problem409' }
    PayloadTooLarge: { $ref: '#/components/responses/Problem413' }
    UnsupportedMediaType: { $ref: '#/components/responses/Problem415' }
    ValidationError: { $ref: '#/components/responses/Problem422' }
    TooManyRequests: { $ref: '#/components/responses/Problem429' }
    InternalError: { $ref: '#/components/responses/Problem500' }
    ServiceUnavailable: { $ref: '#/components/responses/Problem503' }
    ImportValidationError:
      description: File-level or row-level validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ImportProblem' }
    Problem400: { description: Malformed request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem401: { description: Authentication required or invalid, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem403: { description: Authenticated principal lacks permission, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem404: { description: Resource not found or not owned, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem409: { description: 'State, idempotency, or optimistic-concurrency conflict', content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem413: { description: Request exceeds configured byte limit, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem415: { description: Unsupported request media type, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem422: { description: Request validation failed, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem429: { description: Rate limit exceeded, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem500: { description: Unexpected server error, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Problem503: { description: Required dependency unavailable, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    Ulid: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$', example: 01K6H2B57Y9X2A1B3C4D5E6F7G }
    MoneyAmount: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{2})$', example: '19.99' }
    MoneyInput: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$', example: '19.99' }
    WeightKilograms: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{4}$', example: '1.2500' }
    WeightKilogramsInput: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$', example: '1.25' }
    CurrencyCode: { type: string, pattern: '^[A-Z]{3}$', example: USD }
    UtcTimestamp: { type: string, format: date-time, pattern: 'Z$', example: '2026-10-04T15:30:00Z' }
    Version: { type: integer, minimum: 1 }
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, enum: [10, 20, 50, 100] }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
      additionalProperties: false
    ProblemFields:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    ProblemDetails:
      allOf:
        - { $ref: '#/components/schemas/ProblemFields' }
      unevaluatedProperties: false
    TaxDeleteProblem:
      allOf:
        - { $ref: '#/components/schemas/ProblemFields' }
        - type: object
          properties:
            active_product_references: { type: integer, minimum: 0 }
            active_shipping_method_references: { type: integer, minimum: 0 }
      unevaluatedProperties: false
    ImportProblem:
      allOf:
        - { $ref: '#/components/schemas/ProblemFields' }
        - type: object
          properties:
            row_errors:
              type: array
              items: { $ref: '#/components/schemas/ImportRejection' }
      unevaluatedProperties: false
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
      additionalProperties: false
    Address:
      type: object
      required: [name, line1, city, region, postal_code, country, phone]
      properties:
        name: { type: string, maxLength: 200 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 32 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        phone: { type: string, minLength: 1, maxLength: 32 }
      additionalProperties: false
    SetupAdminInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 255, pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$' }
      additionalProperties: false
    RegistrationInput:
      type: object
      required: [name, email, password, address]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 255, pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+$' }
        address: { $ref: '#/components/schemas/Address' }
      additionalProperties: false
    Principal:
      type: object
      required: [id, name, email, role]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, customer] }
      additionalProperties: false
    Category:
      type: object
      required: [id, name, slug, active, version]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        active: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
      additionalProperties: false
    CategoryInput:
      type: object
      required: [name, slug, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 200 }
        active: { type: boolean }
      additionalProperties: false
    Tax:
      type: object
      required: [id, name, rate, active, version]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        rate: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$' }
        active: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
      additionalProperties: false
    TaxInput:
      type: object
      required: [name, rate, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        rate: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$' }
        active: { type: boolean }
      additionalProperties: false
    ShippingMethod:
      type: object
      required: [id, name, amount, currency, active, version]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        active: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
      additionalProperties: false
    ShippingMethodInput:
      type: object
      required: [name, amount, currency, tax_id, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        tax_id: { $ref: '#/components/schemas/Ulid' }
        active: { type: boolean }
      additionalProperties: false
    Product:
      type: object
      required: [id, sku, name, description, price, weight_kg, price_excludes_tax, currency, category, tax_id, image_url, in_stock, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/MoneyAmount' }
        weight_kg: { $ref: '#/components/schemas/WeightKilograms' }
        price_excludes_tax: { type: boolean, const: true, description: Confirms that price is the base unit price before tax. }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        category:
          description: Active category metadata, or null for the virtual Uncategorized grouping.
          oneOf:
            - { $ref: '#/components/schemas/Category' }
            - { type: 'null' }
        tax_id:
          description: Active tax identifier used when calculating checkout totals, or null when no tax applies.
          oneOf:
            - { $ref: '#/components/schemas/Ulid' }
            - { type: 'null' }
        image_url: { type: string, format: uri-reference }
        in_stock: { type: boolean }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
      additionalProperties: false
    ProductInput:
      type: object
      required: [sku, name, description, price, weight_kg, currency, category_id, tax_id, active]
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        price: { $ref: '#/components/schemas/MoneyInput' }
        weight_kg: { $ref: '#/components/schemas/WeightKilogramsInput' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        category_id: { $ref: '#/components/schemas/Ulid' }
        tax_id: { $ref: '#/components/schemas/Ulid' }
        active: { type: boolean }
        initial_on_hand: { type: integer, minimum: 0 }
      additionalProperties: false
    ProductPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: false
    CartLineInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        quantity: { type: integer, minimum: 1, maximum: 999 }
      additionalProperties: false
    CartLine:
      type: object
      required: [product_id, name, quantity, unit_price, line_subtotal, currency, available]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { $ref: '#/components/schemas/MoneyAmount' }
        line_subtotal: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        available: { type: boolean }
        stock_limit: { type: integer, minimum: 0 }
        adjustment: { type: string }
      additionalProperties: false
    Cart:
      type: object
      required: [lines, subtotal, product_tax, shipping_tax, tax, shipping, total, currency, requires_confirmation]
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        subtotal: { $ref: '#/components/schemas/MoneyAmount' }
        product_tax: { $ref: '#/components/schemas/MoneyAmount', description: Sum of independently rounded product-line taxes; zero when no products are taxable. }
        shipping_tax: { $ref: '#/components/schemas/MoneyAmount', description: Independently rounded shipping tax; zero when shipping has no tax assignment. }
        tax: { $ref: '#/components/schemas/MoneyAmount', description: Backward-compatible aggregate equal to product_tax plus shipping_tax. }
        shipping: { $ref: '#/components/schemas/MoneyAmount' }
        total: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        requires_confirmation: { type: boolean }
      additionalProperties: false
    CheckoutInput:
      type: object
      required: [email, shipping_address, shipping_method_id, lines, payment_test_number]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        shipping_address: { $ref: '#/components/schemas/Address' }
        shipping_method_id: { $ref: '#/components/schemas/Ulid' }
        lines: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/CartLineInput' } }
        payment_test_number: { type: string, enum: ['4000000000010001', '4000000000000002', '4000000000090003', '4000000000080004'] }
      additionalProperties: false
    CheckoutResult:
      type: object
      required: [order, guest]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        guest: { type: boolean }
        guest_order_url: { type: string, format: uri-reference, description: Returned exactly once for guest checkout. }
      additionalProperties: false
    OrderStatus: { type: string, enum: [awaiting_payment, paid, payment_failed, expired, manual_review, review_processed] }
    PaymentStatus: { type: string, enum: [pending, succeeded, declined, error, manual_review] }
    OrderStatusView:
      type: object
      required: [order_id, status, payment_status, updated_at]
      properties:
        order_id: { $ref: '#/components/schemas/Ulid' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
      additionalProperties: false
    Order:
      type: object
      required: [id, number, status, payment_status, lines, total, currency, shipping_address, version, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        total: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        shipping_address: { $ref: '#/components/schemas/Address' }
        version: { $ref: '#/components/schemas/Version' }
        created_at: { $ref: '#/components/schemas/UtcTimestamp' }
        updated_at: { $ref: '#/components/schemas/UtcTimestamp' }
        state_history:
          type: array
          items: { type: object, additionalProperties: true }
        reservations:
          type: array
          items: { type: object, additionalProperties: true }
        payment:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        manual_review:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: 'null' }
        customer_email: { type: string, format: email }
        shipping_method_name: { type: string }
        amounts:
          type: object
          required: [subtotal, product_tax, shipping, shipping_tax, total, currency]
          properties:
            subtotal: { $ref: '#/components/schemas/MoneyAmount' }
            product_tax: { $ref: '#/components/schemas/MoneyAmount' }
            shipping: { $ref: '#/components/schemas/MoneyAmount' }
            shipping_tax: { $ref: '#/components/schemas/MoneyAmount' }
            total: { $ref: '#/components/schemas/MoneyAmount' }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
          additionalProperties: false
      additionalProperties: false
    OrderPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
      additionalProperties: false
    PaymentWebhookInput:
      type: object
      required: [event_id, commerce_payment_id, provider_payment_id, outcome, provider_code, occurred_at]
