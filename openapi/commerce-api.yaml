        outcome: { type: string, enum: [succeeded, declined, error] }
        provider_code: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 64 }
        occurred_at: { $ref: '#/components/schemas/UtcTimestamp' }
      additionalProperties: false
    Inventory:
      type: object
      required: [product_id, on_hand, reserved, available]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
